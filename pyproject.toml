[project]
name = "content-systems"
version = "1.0.0"
description = "Autonomous Self-Evaluating Lesson Content Generator with LangGraph and Binary Rubric Evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-groq>=0.2.3",
    "langchain-google-genai>=2.0.8",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "streamlit>=1.41.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["content_agent*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
